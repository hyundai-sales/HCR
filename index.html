<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#003b70">
  <title>TEAM RER | Hyundai PDF Generator</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #eef3f8;
      font-family: Arial, sans-serif;
      color: #172b43;
    }

    .card {
      width: 100%;
      max-width: 410px;
      padding: 34px 26px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0,0,0,.08);
      text-align: center;
    }

    .logo {
      width: 58px;
      height: 58px;
      margin: 0 auto 15px;
      display: grid;
      place-items: center;
      border-radius: 15px;
      background: #003b70;
      color: white;
      font-size: 25px;
      font-weight: bold;
    }

    h1 {
      margin: 0;
      color: #003b70;
      font-size: 27px;
    }

    .subtitle {
      margin: 9px 0 25px;
      color: #64748b;
      font-size: 14px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 9px;
      background: #003b70;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    .google {
      background: white;
      color: #24364b;
      border: 1px solid #d5dce5;
    }

    .message {
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
      background: #f1f5f9;
      color: #475569;
      font-size: 13px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .hidden { display: none; }

    .footer {
      margin-top: 25px;
      color: #94a3b8;
      font-size: 11px;
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="logo">RER</div>
    <h1>TEAM RER</h1>
    <p class="subtitle">Hyundai Price List PDF Generator</p>

    <section id="loginSection">
      <button id="loginBtn" class="google">
        Sign in with Google
      </button>
      <div id="loginMessage" class="message">
        Sign in using your authorized TEAM RER Gmail account.
      </div>
    </section>

    <section id="userSection" class="hidden">
      <p><strong>TEAM RER access confirmed</strong></p>
      <div id="userDetails" class="message"></div>
      <button id="logoutBtn">Sign Out</button>
    </section>

    <div class="footer">TEAM RER • Hyundai Cainta</div>
  </main>

  <iframe
    id="bridgeFrame"
    name="bridgeFrame"
    class="hidden"
    title="TEAM RER authorization">
  </iframe>

  <form
    id="bridgeForm"
    method="POST"
    target="bridgeFrame"
    action="https://script.google.com/macros/s/AKfycbyoEk3ZaWlq0veoamAAns3pKuyXoQ39IfeY9BY-8SWNeAHn382-ZwwsAuKiEzIQph8/exec">

    <input type="hidden" name="action" value="authorize">
    <input type="hidden" name="idToken" id="tokenField">
    <input type="hidden" name="nonce" id="nonceField">
  </form>

  <script type="module">
    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";

    import {
      getAuth,
      GoogleAuthProvider,
      signInWithPopup,
      onAuthStateChanged,
      signOut
    } from
      "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyACEuFMX0ly0p4RpkqJCIhL6TTfIrsrEiA",
      authDomain: "team-rer-hyundai.firebaseapp.com",
      projectId: "team-rer-hyundai",
      storageBucket: "team-rer-hyundai.firebasestorage.app",
      messagingSenderId: "419126543512",
      appId: "1:419126543512:web:3b5e11657efa4cc7417ced",
      measurementId: "G-EB98RG1VYH"
    };

    const SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbyoEk3ZaWlq0veoamAAns3pKuyXoQ39IfeY9BY-8SWNeAHn382-ZwwsAuKiEzIQph8/exec";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    provider.setCustomParameters({ prompt: "select_account" });

    const loginBtn = document.getElementById("loginBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const loginMessage = document.getElementById("loginMessage");
    const loginSection = document.getElementById("loginSection");
    const userSection = document.getElementById("userSection");
    const userDetails = document.getElementById("userDetails");

    const bridgeForm = document.getElementById("bridgeForm");
    const tokenField = document.getElementById("tokenField");
    const nonceField = document.getElementById("nonceField");
    const bridgeFrame = document.getElementById("bridgeFrame");

    let pendingNonce = null;
    let authorizedUser = null;

    function showError(message) {
      loginSection.classList.remove("hidden");
      userSection.classList.add("hidden");
      loginMessage.textContent = message;
      loginBtn.disabled = false;
    }

    function requestAuthorization(user) {
      loginBtn.disabled = true;
      loginMessage.textContent = "Checking TEAM RER access...";

      user.getIdToken(true).then(token => {
        const nonce = Array.from(
          crypto.getRandomValues(new Uint8Array(24))
        ).map(value => value.toString(16).padStart(2, "0")).join("");

        pendingNonce = nonce;
        tokenField.value = token;
        nonceField.value = nonce;

        bridgeForm.submit();
      }).catch(error => {
        console.error(error);
        showError("Unable to verify your sign-in. Please try again.");
      });
    }

    window.addEventListener("message", event => {
  
      if (!/^https:\/\/(?:[a-z0-9-]+-)?script\.googleusercontent\.com$/i.test(event.origin)) return;
      if (!event.data || event.data.nonce !== pendingNonce) return;

      pendingNonce = null;
      tokenField.value = "";
      nonceField.value = "";

      if (!event.data.success) {
        authorizedUser = null;
        showError(event.data.error || "TEAM RER access denied.");
        return;
      }

      authorizedUser = event.data.user;

      loginSection.classList.add("hidden");
      userSection.classList.remove("hidden");

      userDetails.textContent =
        "Name: " + authorizedUser.name +
        " | Role: " + authorizedUser.role +
        " | Email: " + authorizedUser.email;

      loginBtn.disabled = false;
    });

    loginBtn.addEventListener("click", async () => {
      loginBtn.disabled = true;
      loginMessage.textContent = "Connecting to Google...";

      try {
        const result = await signInWithPopup(auth, provider);
        requestAuthorization(result.user);
      } catch (error) {
        console.error(error);
        showError("Sign-in failed: " + error.message);
      }
    });

    logoutBtn.addEventListener("click", async () => {
      authorizedUser = null;
      await signOut(auth);
    });

    onAuthStateChanged(auth, user => {
      if (!user) {
        authorizedUser = null;
        pendingNonce = null;
        userSection.classList.add("hidden");
        loginSection.classList.remove("hidden");
        loginBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
